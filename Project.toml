name = "HakataiCyclostratigraphy"
authors = ["Ilja J. Kocken <ikocken@hawaii.edu>"]
version = "1.0.0"

# Self-contained environment for the Hakatai (ZB23.N64) cyclostratigraphy
# analysis. Deliberately does NOT depend on any unpublished/private package.
# RCall is intentionally absent: the optional astrochron cross-check has its
# own environment in `crosscheck/`. See README.md.

